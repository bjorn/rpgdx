services:
  web:
    build:
      context: .
      dockerfile: docker/apache/Dockerfile
    ports:
      - "127.0.0.1:${RPGDX_PORT:-8083}:80"
    volumes:
      - ./:/var/www/html:delegated
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mariadb:11.7
    environment:
      MARIADB_ROOT_PASSWORD: rpgdx_root
      MARIADB_DATABASE: rpgdx
      MARIADB_USER: username
      MARIADB_PASSWORD: password
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  db_data:
